name: Set up Python
description: Install the pinned Python toolchain shared by HostDelta CI jobs.
inputs:
  python-version:
    description: Python version to install.
    default: '3.14'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node.js 24
      with:
        python-version: ${{ inputs.python-version }}
