name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pre-check:
    uses: ./.github/workflows/pre-check.yml

  tests:
    needs: pre-check
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node.js 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node.js 24
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python scripts/build_release.py
      - run: python dist/hostdelta.pyz demo --json > demo.json
      - run: python -m pip install .
      - run: hostdelta --version
      - name: Linux live smoke test
        if: runner.os == 'Linux'
        run: |
          export HOSTDELTA_STATE_DIR="$RUNNER_TEMP/hostdelta"
          hostdelta init --json
          hostdelta snapshot --label smoke --json
          hostdelta diff HEAD~1 HEAD --json
          hostdelta record --actor ci-agent --kind failure --message 'Synthetic CI failure' --json
          hostdelta brief --consumer ci-agent --json > brief.json
          python -c 'import json; r=json.load(open("brief.json")); assert r["schema_version"]==1; assert r["current_state"]["domains"]["packages"]["status"]=="ok"; assert r["current_state"]["domains"]["system"]["status"]=="ok"; assert r["event_counts"]["agent_failure"]==1'
          hostdelta config --check examples/hostdelta.json --json
          hostdelta collect --config examples/hostdelta.json --json > collection.json || test "$?" -eq 3
          hostdelta events --since 1h --json
          hostdelta brief --archive --since 1h --json
